groups:
  - name: lexicheck-slo
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(lexicheck_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(lexicheck_http_requests_total[5m])), 1e-9) > 0.01
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "More than 1% of API requests are failing"

      - alert: SlowChecks
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(lexicheck_http_request_duration_seconds_bucket{route="/v1/check"}[5m]))
          ) > 0.5
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "p95 latency of /v1/check above 500ms"

      - alert: ApiDown
        expr: up{job="lexicheck-api"} == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "Prometheus cannot scrape the API"
