# Local stack that mirrors production topology:
# web (nginx ~ CloudFront) -> api (~ ECS) -> postgres (~ RDS), plus Prometheus/Grafana.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lexi
      POSTGRES_PASSWORD: lexi
      POSTGRES_DB: lexicheck
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexi"]
      interval: 5s
      retries: 10

  api:
    build: ./api
    environment:
      LEXI_DATABASE_URL: postgresql+psycopg://lexi:lexi@db:5432/lexicheck
      LEXI_CORS_ORIGINS: '["http://localhost:8081"]'
      # Optional: AI rewrite. Passed through from your shell (e.g. `make up` loads
      # .env.local). Empty means the feature stays hidden.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      db: { condition: service_healthy }
    ports: ["8080:8080"]

  web:
    build: ./web
    depends_on: [api]
    ports: ["8081:80"]

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: [observability]
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

volumes:
  pgdata:
