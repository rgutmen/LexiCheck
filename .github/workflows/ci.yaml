name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow differs when Release calls this file, so the two never cancel each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1
        with: { node-version: "24", cache: true, working-directory: web }
      - run: vp install
      - run: vp check
      - run: vp build

  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive infra/terraform
      - name: validate every environment
        run: |
          for env in infra/terraform/envs/*/; do
            terraform -chdir="$env" init -backend=false -input=false
            terraform -chdir="$env" validate
          done
      - name: Trivy, Terraform misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
          exit-code: "1"

  # Trivy on the source tree: known CVEs in uv.lock / package-lock.json, plus
  # leaked secrets (keys, tokens) committed by mistake.
  deps-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # Trivy on the built image: OS packages and Python libraries that actually ship.
  image-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t lexicheck-api:ci api
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lexicheck-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # Boots the real stack (nginx + API + Postgres) and exercises it end to end.
  smoke:
    runs-on: ubuntu-24.04
    needs: [api, web]
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --build --wait
      - run: |
          curl -fsS localhost:8081/api/readyz
          curl -fsS -X POST localhost:8081/api/v1/check \
            -H 'content-type: application/json' -d '{"text":"Ths is a tset"}' \
            | jq -e '.issues | length == 2'
      - if: failure()
        run: docker compose logs
