# main -> build once -> dev -> staging -> prod (manual approval on the prod environment).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Redeploy an existing image tag (rollback). Leave empty to build HEAD."
        required: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    if: ${{ !inputs.image_tag }}
    uses: ./.github/workflows/ci.yaml

  # Deploy jobs only run once the repo is connected to AWS (see README, CI/CD).
  # Until then, set nothing and pushes just run CI.
  build:
    needs: ci
    if: ${{ always() && vars.AWS_DEPLOY_ENABLED == 'true' && (needs.ci.result == 'success' || inputs.image_tag) }}
    runs-on: ubuntu-latest
    environment: build
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: echo "value=${{ inputs.image_tag || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: voidzero-dev/setup-vp@v1
        with: { node-version: "24", cache: true }
      - run: vp install && vp build
        working-directory: web
      - uses: actions/upload-artifact@v7
        with: { name: web-dist, path: web/dist, retention-days: 30 }

      - if: ${{ !inputs.image_tag }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.BUILD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - if: ${{ !inputs.image_tag }}
        uses: aws-actions/amazon-ecr-login@v2
      - if: ${{ !inputs.image_tag }}
        uses: docker/setup-qemu-action@v4
      - if: ${{ !inputs.image_tag }}
        uses: docker/setup-buildx-action@v4
      # Pushed to every environment's registry: tags are immutable, so a rollback is
      # just redeploying an older SHA through workflow_dispatch.
      - if: ${{ !inputs.image_tag }}
        uses: docker/build-push-action@v7
        with:
          context: api
          platforms: linux/arm64
          push: true
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ vars.ECR_DEV }}:${{ steps.tag.outputs.value }}
            ${{ vars.ECR_STAGING }}:${{ steps.tag.outputs.value }}
            ${{ vars.ECR_PROD }}:${{ steps.tag.outputs.value }}

  dev:
    needs: build
    if: ${{ always() && needs.build.result == 'success' }}
    uses: ./.github/workflows/deploy-env.yaml
    with: { environment: dev, image_tag: "${{ needs.build.outputs.image_tag }}" }

  staging:
    needs: [build, dev]
    if: ${{ always() && needs.dev.result == 'success' }}
    uses: ./.github/workflows/deploy-env.yaml
    with: { environment: staging, image_tag: "${{ needs.build.outputs.image_tag }}" }

  prod:
    needs: [build, staging]
    if: ${{ always() && needs.staging.result == 'success' }}
    uses: ./.github/workflows/deploy-env.yaml
    with: { environment: prod, image_tag: "${{ needs.build.outputs.image_tag }}" }
